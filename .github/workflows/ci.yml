name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install ripgrep (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - run: npm ci

      - name: Check (lint + test + coverage)
        run: npm run check

      - name: Grep gate - no child_process.exec
        run: "! git grep -nE 'child_process\\.exec\\(' -- 'src/**' || (echo 'FAIL: child_process.exec found in src/' && exit 1)"

      - name: Grep gate - no bare Error in src
        run: "! git grep -nE 'throw new Error\\(' -- 'src/**' || (echo 'FAIL: bare Error found in src/' && exit 1)"
