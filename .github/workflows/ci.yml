name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install ripgrep (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: node --test $(find test/unit -name "*.test.mjs" | sort)

      - name: Integration tests
        run: node --test $(find test/integration -name "*.test.mjs" | sort)

      - name: E2E tests
        run: node --test $(find test/e2e -name "*.test.mjs" | sort)

      - name: Coverage gate
        run: npx c8 --include "src/**/*.mjs" --exclude "src/mcp-server.mjs" --check-coverage --lines 83 node --test $(find test/unit test/integration -name "*.test.mjs" | sort)

      - name: Grep gate - no child_process.exec
        run: "! git grep -nE 'child_process\\.exec\\(' -- 'src/**' || (echo 'FAIL: child_process.exec found in src/' && exit 1)"

      - name: Grep gate - no bare Error in src
        run: "! git grep -nE 'throw new Error\\(' -- 'src/**' || (echo 'FAIL: bare Error found in src/' && exit 1)"

      - name: Real-claude smoke (skipped when API key absent)
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not set — skipping real-claude smoke" >&2
            exit 0
          fi
          node bin/claude-rca doctor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
